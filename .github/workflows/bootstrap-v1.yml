name: Initialiser et verifier Chhal V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chhal-initialisation-v1
  cancel-in-progress: false

jobs:
  initialiser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer les sources V1 verifiees
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd().resolve()
          if (root / "apps/api/src/app.ts").exists():
              raise SystemExit("Sources deja presentes : ne pas ecraser le depot.")
          archive = root / "Chhal_V1_Code_Passation_2026-10-25.zip"
          expected = "e545f3a42244a9d3abf6e79ce7de0b0eee6ead19d17108870e50aa17bcfbd404"
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("Empreinte de livraison incorrecte.")
          count = 0
          with zipfile.ZipFile(archive) as source:
              manifest = json.loads(source.read("MANIFEST-V1.json"))
              for entry in manifest:
                  name = PurePosixPath(entry["file"])
                  if name.is_absolute() or ".." in name.parts or "\\" in str(name):
                      raise SystemExit("Chemin interdit.")
                  data = source.read(str(name))
                  if hashlib.sha256(data).hexdigest() != entry["sha256"]:
                      raise SystemExit("Contenu de livraison incorrect.")
                  if name.parts[0] == ".github":
                      continue
                  if name.parts[0] in {".data", ".cache", ".git", "node_modules"} or str(name) == ".env":
                      raise SystemExit("Fichier prive interdit.")
                  target = (root / str(name)).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit("Cible interdite.")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  count += 1
          print(f"{count} fichiers source restaures, sans base locale ni secret.")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activer pnpm
        run: corepack enable
      - name: Installer la livraison
        run: corepack pnpm install --frozen-lockfile
      - name: Installer les outils Cloudflare approuves
        run: corepack pnpm --filter @chhal/web add -D @opennextjs/cloudflare wrangler
      - name: Preparer OpenNext
        run: node scripts/setup-cloudflare.mjs
      - name: Tester la V1 hors reseau
        run: node scripts/test-offline.mjs
      - name: Construire le Worker
        run: corepack pnpm --filter @chhal/web build:worker
      - name: Enregistrer les sources et le verrou de dependances
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Importer Chhal V1 et preparer le Worker Cloudflare"
          git push origin HEAD:main
